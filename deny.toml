# Windows only: the lockfile also lists crates for other platforms that never compile. The app and
# the stub are 64-bit. The client is 32-bit, built for i686-win7-windows-msvc, which compiles the
# same crates as i686-pc-windows-msvc.
[graph]
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Unlicense",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
