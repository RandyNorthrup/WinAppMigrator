[package]
name = "winappmigrator-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"
doctest = false

# The executable demands elevation, so its own test harness could not start from a
# normal shell. All logic and tests live in the library.
[[bin]]
name = "winappmigrator-installer"
path = "src/main.rs"
test = false

[dependencies]
winappmigrator-core.workspace = true
winappmigrator-ui.workspace = true
eframe.workspace = true
rfd.workspace = true
clap.workspace = true
tracing.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[build-dependencies]
embed-manifest.workspace = true
winresource.workspace = true

[lints]
workspace = true
