[package]
name = "winappmigrator-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# Accessibility-tree checks for the UI tests of the app, the installer, and the uninstaller.
test-support = ["dep:egui_kittest"]

[dependencies]
winappmigrator-i18n.workspace = true
unicode-bidi.workspace = true
windows.workspace = true
eframe.workspace = true
# Not called directly: selects the Direct3D 12 backend for eframe's renderer.
wgpu.workspace = true
egui_kittest = { workspace = true, optional = true }

[dev-dependencies]
egui_kittest.workspace = true
