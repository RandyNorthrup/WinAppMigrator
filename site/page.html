<!doctype html>
<html lang="${lang}" dir="${dir}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https://raw.githubusercontent.com data:; style-src 'self' 'unsafe-inline'; script-src 'self' ${mermaid_url}; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>${title}</title>
  <meta name="description" content="${description}">
  <link rel="canonical" href="${canonical}">
${alternates}
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="WinAppMigrator">
  <meta property="og:title" content="${title}">
  <meta property="og:description" content="${description}">
  <meta property="og:url" content="${canonical}">
  <meta property="og:image" content="${base_url}/images/app-pick-light.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  ${scripts}
</head>
<body>
  <a class="skip" href="#content">${s_skip}</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="./"><img src="icon.png" alt="" width="28" height="28">WinAppMigrator</a>
      <nav class="top-links" aria-label="${s_site}">
        <a href="Home">${s_docs}</a>
        <a href="https://github.com/${repository}/releases/latest">${s_download}</a>
        <a href="https://github.com/${repository}">GitHub</a>
${languages}
      </nav>
    </div>
  </header>
  <div class="docs">
    <details class="sidebar" id="sidebar">
      <summary>${s_all_pages}</summary>
      <nav aria-label="${s_documentation}">
${sidebar}
      </nav>
    </details>
    <main id="content" class="markdown">
${notice}
${content}
      <p class="updated">${s_updated}</p>
    </main>
  </div>
  <footer class="bottom">
    <div class="bottom-inner">
${footer}
      <p>${s_built}</p>
    </div>
  </footer>
</body>
</html>
