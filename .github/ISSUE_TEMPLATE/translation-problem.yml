name: Translation Problem
description: Words in your language that are wrong, unclear, or cut off.
title: "[language] "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. WinAppMigrator's translations were made by machine, so every report from someone who speaks the
        language makes them better. You can write in your own language.
  - type: input
    id: language
    attributes:
      label: Language
      description: Its tag, such as it-IT, or its name.
      placeholder: it-IT
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where You Saw It
      description: Which window, and which button, title, or message.
      placeholder: The installer, under Install Location
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What It Says
      description: Copy the words as they are, or attach a screenshot.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What It Should Say
      description: Your wording, if you have one.
  - type: input
    id: version
    attributes:
      label: WinAppMigrator Version
      placeholder: "0.7.0"
