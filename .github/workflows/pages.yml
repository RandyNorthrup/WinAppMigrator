name: Website

# Builds https://winappmigrator.com from the wiki and site/, and publishes it with Cloudflare Pages (project
# winappmigrator). GitHub Pages keeps its last deployment and its custom domain only so that the old
# randynorthrup.github.io/WinAppMigrator addresses go on redirecting to winappmigrator.com.
# Search engines do not read a GitHub wiki until its repository has 500 stars, so this is where they find the docs.
# It runs when the site's own files change, when the wiki is edited, after a release is published, once a day, and by
# hand.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "docs/images/**"
      - "crates/winappmigrator-ui/assets/**"
      - ".github/scripts/build-site.py"
      - ".github/workflows/pages.yml"
      - ".github/axe/**"
  gollum:
  # A release's own run is on its tag, which may not deploy to github-pages. This one runs on main once it has finished,
  # so the landing page shows the new version. It checks out main, never what the release ran on.
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  # A wiki edit, made on the web or pushed with git, raises gollum. The daily run catches up on one that was missed or
  # failed. Only pages that changed are sent to search engines, so a day with no change tells them nothing.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://winappmigrator.com
  # IndexNow tells Bing, and the search engines that share its index, which pages changed. The key is public by design:
  # site/<key>.txt holds it, to show that whoever sends it owns the site.
  INDEXNOW_KEY: 4da2307d903eb83c021e02170dbdc170

jobs:
  build:
    name: Build the website
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The date each page last changed, for the sitemap, comes from git.
          fetch-depth: 0
          persist-credentials: false

      - name: Clone the wiki
        run: git clone --quiet "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.wiki.git" "${RUNNER_TEMP}/wiki"

      - name: Check the IndexNow key file
        run: test "$(cat "site/${INDEXNOW_KEY}.txt")" = "${INDEXNOW_KEY}"

      - name: Fetch the live sitemap
        id: sitemap
        # What changed since it is what search engines are told about. Before the first deploy there is none, and every
        # page is new. If it cannot be read, nothing is sent, rather than every page again.
        run: |
          status="$(curl --silent --show-error --location --max-time 30 --write-out '%{http_code}' \
            --output "${RUNNER_TEMP}/old-sitemap.xml" "${SITE_URL}/sitemap.xml")" || status="failed"
          case "${status}" in
            200)
              echo "notify=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              rm -f "${RUNNER_TEMP}/old-sitemap.xml"
              echo "notify=true" >> "${GITHUB_OUTPUT}"
              echo "::notice::No live sitemap yet, so every page counts as new."
              ;;
            *)
              echo "notify=false" >> "${GITHUB_OUTPUT}"
              echo "::warning::The live sitemap could not be read (${status}), so search engines are not told what changed this time."
              ;;
          esac

      - name: Build
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTIFY: ${{ steps.sitemap.outputs.notify }}
        run: |
          changes=()
          if [ "${NOTIFY}" = "true" ]; then
            changes=(--old-sitemap "${RUNNER_TEMP}/old-sitemap.xml" --changed-out "${RUNNER_TEMP}/changed.txt")
          fi
          python3 -I .github/scripts/build-site.py \
            --wiki "${RUNNER_TEMP}/wiki" \
            --out _site \
            --base-url "${SITE_URL}" \
            "${changes[@]}"
          {
            echo "changed<<CHANGED_URLS"
            if [ -f "${RUNNER_TEMP}/changed.txt" ]; then cat "${RUNNER_TEMP}/changed.txt"; fi
            echo "CHANGED_URLS"
          } >> "${GITHUB_OUTPUT}"

      - name: Check every page against WCAG 2.2 AA with axe-core
        # In a real browser, in light and dark, every language's pages. Pinned in .github/axe/package-lock.json.
        working-directory: .github/axe
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          node scan-site.mjs "${GITHUB_WORKSPACE}/_site" "${SITE_URL}"

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Publish the website
    needs: build
    # Only main is published. The cloudflare-pages environment, which holds the token, says the same; this keeps it so
    # if that setting changes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ env.SITE_URL }}
    steps:
      # Only the pinned deploy tool is taken from the repository; nothing it builds runs here.
      - name: Checkout the deploy tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/cloudflare
          sparse-checkout-cone-mode: false

      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - name: Deploy to Cloudflare Pages
        # wrangler is pinned in .github/cloudflare/package-lock.json. The token may only edit Cloudflare Pages, in this
        # one account.
        working-directory: .github/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm ci --ignore-scripts
          npx --no-install wrangler pages deploy "${GITHUB_WORKSPACE}/_site" \
            --project-name winappmigrator \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Website from ${GITHUB_SHA::7}"

      - name: Tell search engines what changed
        if: needs.build.outputs.changed != ''
        env:
          CHANGED: ${{ needs.build.outputs.changed }}
        # A search engine that is down must not fail a published site, so a refusal is a warning.
        run: |
          python3 -I - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          site = os.environ["SITE_URL"]
          key = os.environ["INDEXNOW_KEY"]
          urls = [url for url in os.environ["CHANGED"].split() if url]
          body = {
              "host": urllib.parse.urlsplit(site).hostname,
              "key": key,
              "keyLocation": f"{site}/{key}.txt",
              "urlList": urls,
          }
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow took {len(urls)} URLs: HTTP {response.status}")
          except (urllib.error.URLError, TimeoutError) as error:
              print(f"::warning::IndexNow did not take the changed pages: {error}")
          PY
