name: Release

# A release is cut by pushing a v* tag. To retry a run that failed before publishing,
# start this workflow from that tag ("Use workflow from"): the signing environment
# accepts v* tags only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The client the app saves for the old PC, built for Windows 7 and later, which takes the standard
  # library built for that target; see the script. The app carries it, so it is signed before the app
  # is built, in a job of its own.
  client:
    name: Build the client for Windows 7 and later
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rust-src

      - name: Build the client
        shell: pwsh
        run: scripts/build-client.ps1

      - name: Hand on the client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wam-client-unsigned
          path: target\win7\i686-win7-windows-msvc\release\winappmigrator-client.exe
          retention-days: 1
          if-no-files-found: error

  # Signed apart from every build, so that nothing from the repository or crates.io runs once this
  # can sign: only pinned actions, and the client, which is not run. See docs/signing.md for why the
  # client may be signed and the stub may not.
  sign-client:
    name: Sign the client
    needs: client
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write # signs in to Azure for code signing
    steps:
      - name: Take the client
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wam-client-unsigned
          path: ${{ runner.temp }}\wam-client

      - name: Sign in to Azure for code signing
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the client
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://wus.codesigning.azure.net/
          signing-account-name: scnetsolutions
          certificate-profile-name: SAKUtility
          files: ${{ runner.temp }}\wam-client\winappmigrator-client.exe
          description: WinAppMigrator Client
          description-url: https://github.com/RandyNorthrup/WinAppMigrator
          exclude-environment-credential: true

      - name: Hand on the signed client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wam-client-signed
          path: ${{ runner.temp }}\wam-client\winappmigrator-client.exe
          retention-days: 1
          if-no-files-found: error

  release:
    name: Build, sign, and publish Windows x64 release
    needs: sign-client
    runs-on: windows-latest
    # Azure trusts GitHub's sign-in token only from this environment, which only v*
    # tags can use.
    environment: release
    permissions:
      contents: write # publishes the release
      id-token: write # signs in to Azure for code signing and signs the provenance
      attestations: write # stores it on GitHub, for `gh attestation verify`

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, rust-src

      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ((cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'winappmigrator-gui').version
          if ($env:TAG -ne "v$version") { throw "The tag is $env:TAG, but Cargo.toml says the version is $version." }

      - name: Lint
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        shell: pwsh
        run: cargo test --locked --workspace --all-features

      # Regenerate the open-source attribution bundle so it always matches the
      # dependencies actually compiled into this release. This installs a tool from
      # crates.io, so it runs before anything can sign in to Azure.
      - name: Generate third-party license attribution
        shell: pwsh
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
          if (-not (Test-Path THIRD-PARTY-LICENSES.md)) { throw 'THIRD-PARTY-LICENSES.md was not generated' }

      # Build the installer stub first so the app can embed the freshly built
      # stub (the app is a single portable exe that carries the stub inside it).
      - name: Build installer stub (release)
        shell: pwsh
        run: cargo build --locked --release -p winappmigrator-installer

      # The stub must never be signed, and is never published on its own. Windows does
      # not hash its own certificate table, so anyone holding a signed stub could hide
      # their own package there, keep a valid signature, and have it run elevated under
      # this project's name. See docs/signing.md.
      - name: Check the stub is unsigned
        shell: pwsh
        run: |
          $status = (Get-AuthenticodeSignature target/release/winappmigrator-installer.exe).Status
          if ($status -ne 'NotSigned') { throw "The installer stub must stay unsigned, but its signature is $status." }

      - name: Take the signed client
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wam-client-signed
          path: ${{ runner.temp }}\wam-client

      # Checked here too, as what this job takes from another.
      - name: Check the client's signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\wam-client\winappmigrator-client.exe"
          if ($signature.Status -ne 'Valid') { throw "The client's signature is $($signature.Status): $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -notmatch 'CN=Randy Northrup') { throw "Signed by someone else: $($signature.SignerCertificate.Subject)" }
          if (-not $signature.TimeStamperCertificate) { throw 'The signature has no timestamp.' }
          Write-Host "Signed by $($signature.SignerCertificate.Subject), timestamped by $($signature.TimeStamperCertificate.Subject)"

      - name: Build app with embedded stub and client (release)
        shell: pwsh
        env:
          WINAPPMIGRATOR_INSTALLER_STUB: ${{ github.workspace }}\target\release\winappmigrator-installer.exe
          WINAPPMIGRATOR_CLIENT: ${{ runner.temp }}\wam-client\winappmigrator-client.exe
        run: cargo build --locked --release -p winappmigrator-gui

      # An app without the stub inside it would build no installers. CI runs the same check.
      - name: Check the app embeds the stub
        shell: pwsh
        run: .github/scripts/check-stub-embedded.ps1 -App target/release/winappmigrator.exe -Stub target/release/winappmigrator-installer.exe

      - name: Check the app embeds the signed client
        shell: pwsh
        run: .github/scripts/check-stub-embedded.ps1 -App target/release/winappmigrator.exe -Stub "$env:RUNNER_TEMP\wam-client\winappmigrator-client.exe" -Name client

      # Code signing with Azure Artifact Signing, under the maintainer's verified
      # identity (CN=Randy Northrup). No password is stored anywhere: Azure accepts
      # GitHub's OIDC token for this repo's "release" environment only, and that
      # identity may do nothing but sign with this one certificate profile.
      - name: Sign in to Azure for code signing
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the app
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://wus.codesigning.azure.net/
          signing-account-name: scnetsolutions
          certificate-profile-name: SAKUtility
          files: ${{ github.workspace }}\target\release\winappmigrator.exe
          description: WinAppMigrator
          description-url: https://github.com/RandyNorthrup/WinAppMigrator
          exclude-environment-credential: true

      - name: Check the signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature target/release/winappmigrator.exe
          if ($signature.Status -ne 'Valid') { throw "The app's signature is $($signature.Status): $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Subject -notmatch 'CN=Randy Northrup') { throw "Signed by someone else: $($signature.SignerCertificate.Subject)" }
          if (-not $signature.TimeStamperCertificate) { throw 'The signature has no timestamp.' }
          Write-Host "Signed by $($signature.SignerCertificate.Subject), timestamped by $($signature.TimeStamperCertificate.Subject)"

      # Checksums come last, so they describe the signed files.
      - name: Stage release artifacts
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $name = "WinAppMigrator-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Force -Path dist, "dist/$name" | Out-Null
          Copy-Item target/release/winappmigrator.exe "dist/$name/winappmigrator.exe"
          Copy-Item README.md, CHANGELOG.md, LICENSE, THIRD-PARTY-LICENSES.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          Copy-Item target/release/winappmigrator.exe "dist/WinAppMigrator-$env:TAG.exe"
          foreach ($f in @("dist/$name.zip", "dist/WinAppMigrator-$env:TAG.exe")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)" | Out-File dist/SHA256SUMS.txt -Append -Encoding ascii
          }
          Write-Host '--- SHA256SUMS.txt ---'
          Get-Content dist/SHA256SUMS.txt

      - name: Record where the downloads were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/WinAppMigrator-*-windows-x64.zip
            dist/WinAppMigrator-*.exe

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $notes = "WinAppMigrator $env:TAG - portable Windows x64 build. A single elevated app (winappmigrator.exe) that carries the self-extracting installer stub inside it. See CHANGELOG.md for details.`n`n**Code signing:** winappmigrator.exe, and WinAppMigrator Client inside it, are signed with Azure Artifact Signing (publisher: Randy Northrup). Installers you build with it are not signed unless you sign them yourself; see docs/signing.md.`n`nCheck the exe or the zip with ``gh attestation verify <file> --repo RandyNorthrup/WinAppMigrator``."
          gh release create $env:TAG `
            "dist/WinAppMigrator-$env:TAG-windows-x64.zip" `
            "dist/WinAppMigrator-$env:TAG.exe" `
            "dist/SHA256SUMS.txt" `
            --title "WinAppMigrator $env:TAG" `
            --notes $notes
