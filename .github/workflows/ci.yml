name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    name: Windows quality gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install security tools
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit,cargo-deny

      - name: Format check
        shell: pwsh
        run: cargo fmt --check

      - name: Typecheck
        shell: pwsh
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Not --all-targets: that runs the executables as test harnesses, and they demand
      # elevation. The end-to-end test does run the installer, and fails here rather
      # than skipping if it cannot.
      - name: Test
        shell: pwsh
        run: cargo test --locked --workspace --all-features

      - name: Security audit
        shell: pwsh
        run: cargo audit

      - name: Dependency policy
        shell: pwsh
        run: cargo deny check

      # The stub first, for the app to carry: a release of it will not build without one.
      - name: Release build of the stub
        shell: pwsh
        run: cargo build --locked --release -p winappmigrator-installer

      - name: Release build
        shell: pwsh
        run: cargo build --locked --workspace --release

      # What a release checks, here where it is run on every push.
      - name: Check the app embeds the stub
        shell: pwsh
        run: .github/scripts/check-stub-embedded.ps1 -App target/release/winappmigrator.exe -Stub target/release/winappmigrator-installer.exe

      # What the job that opens it plants for it not to run. It only says that it ran.
      - name: Build a stand-in for planted code
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/planted | Out-Null
          rustc --edition 2024 --crate-type cdylib --crate-name D3D12Core -C panic=abort -C target-feature=+crt-static -C opt-level=1 -o target/planted/D3D12Core.dll .github/scripts/planted-d3d12core.rs

      - name: Hand on the stand-in
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wam-planted
          path: target\planted\D3D12Core.dll
          retention-days: 1
          if-no-files-found: error

      # For the jobs that open it. Unsigned, as every build here is, and gone in a day.
      - name: Hand on the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wam-app
          path: target\release\winappmigrator.exe
          retention-days: 1
          if-no-files-found: error

  # Runs the code that changes the machine for real, on this throwaway runner, which is
  # elevated and is discarded afterward. The test does nothing without this variable and
  # GitHub's own, and with them it fails rather than skips if it is not elevated.
  elevated-round-trip:
    name: Elevated round trip
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Round trip
        shell: pwsh
        run: cargo test --locked -p winappmigrator-installer --test elevated_round_trip -- --nocapture --test-threads=1

  # A VHD built here and made to look like another PC's drive, real second accounts, and every real scheduled task, on a runner
  # of its own, so that none of it can lean on what the round trip left behind.
  elevated-offline-and-profiles:
    name: Elevated offline and profiles
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Offline, profiles, and tasks
        shell: pwsh
        run: cargo test --locked -p winappmigrator-installer --test elevated_offline_and_profiles -- --nocapture --test-threads=1

  # What a build and an install really read, what they leave, and what happens to a package split
  # in two, on a runner of its own.
  elevated-packaging:
    name: Elevated packaging
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Packaging
        shell: pwsh
        run: cargo test --locked -p winappmigrator-installer --test elevated_packaging -- --nocapture --test-threads=1

  # What a person chooses before a build, on a runner of its own: what is left out, what is added,
  # and what must never be offered.
  elevated-footprint:
    name: Elevated footprint
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Choosing what goes in
        shell: pwsh
        run: cargo test --locked -p winappmigrator-installer --test elevated_footprint -- --nocapture --test-threads=1

  # A real package past what Windows can start as one executable, with a real file of over 4 GiB in
  # it, so it needs a runner with the room to itself.
  elevated-big-package:
    name: Elevated big package
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Big package
        shell: pwsh
        run: cargo test --locked -p winappmigrator-installer --test elevated_big_package -- --nocapture --test-threads=1

  # The first half of a real move between two PCs. What it uploads is unsigned, holds only a fake app
  # set up here, and is gone in a day.
  move-build:
    name: Move between PCs, build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build the installers
        shell: pwsh
        env:
          WAM_MOVE_OUTPUT: ${{ runner.temp }}\wam-move
        run: cargo test --locked -p winappmigrator-installer --test elevated_move -- --nocapture --test-threads=1

      - name: Hand them on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wam-move-installers
          path: ${{ runner.temp }}\wam-move
          retention-days: 1
          if-no-files-found: error

  # The second half, on runners that have never seen it, which build nothing and run nothing of this
  # project's but those files and two scripts, and look with Windows' own tools. Each is its own PC, on
  # a Windows of its own.
  move-install:
    name: Move between PCs, install on ${{ matrix.os }}
    needs: move-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]

    steps:
      - name: Checkout the script, and none of the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Take what the other runner built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wam-move-installers
          path: ${{ runner.temp }}\wam-move

      - name: Install it here, and look
        shell: pwsh
        run: .github/scripts/check-moved-app.ps1 -Folder "${{ runner.temp }}\wam-move"

  # The same with real apps, from their publishers, at the versions and hashes in real-apps.json. What
  # this uploads is a redistribution of them, for a day, to anyone signed in to GitHub, so they are all
  # ones whose licenses allow that:
  #   7-Zip: LGPL-2.1-or-later with the unRAR restriction, and BSD-3-Clause parts
  #   PuTTY: MIT
  #   Eclipse Mosquitto: EPL-2.0 OR BSD-3-Clause
  #   windows_exporter: MIT
  #   Git LFS: MIT
  # No secrets here, and no credentials kept from the checkout, since it runs what they install.
  real-apps-build:
    name: Real apps, build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the real apps from their publishers, and try them
        shell: pwsh
        run: .github/scripts/install-real-apps.ps1 -Output "${{ runner.temp }}\wam-real-apps"

      - name: Build their installers, and look through them
        shell: pwsh
        env:
          WAM_REAL_APPS_OUTPUT: ${{ runner.temp }}\wam-real-apps
        run: cargo test --locked -p winappmigrator-installer --test elevated_real_apps -- --nocapture --test-threads=1

      - name: Hand them on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wam-real-apps
          path: ${{ runner.temp }}\wam-real-apps
          retention-days: 1
          if-no-files-found: error

      # What this builds holds what an account had, with marks in it, so it stays on this runner.
      - name: With the User data option on, what an account has goes too
        shell: pwsh
        env:
          WAM_REAL_APPS_USER_DATA: ${{ runner.temp }}\wam-real-apps-user-data
        run: |
          cargo test --locked -p winappmigrator-installer --test elevated_real_apps -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .github/scripts/check-account-settings.ps1 -Folder "${{ runner.temp }}\wam-real-apps-user-data"

  # Fresh runners, which take away any copy they came with, show that every check fails without the
  # apps, install them, and show that Windows uses what was restored.
  real-apps-install:
    name: Real apps, install on ${{ matrix.os }}
    needs: real-apps-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WAM_ELEVATED_E2E: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]

    steps:
      - name: Checkout the scripts, and none of the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Take what the other runner built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wam-real-apps
          path: ${{ runner.temp }}\wam-real-apps

      - name: Take away any copy here, install them, and ask Windows to use them
        shell: pwsh
        run: .github/scripts/check-moved-real-apps.ps1 -Folder "${{ runner.temp }}\wam-real-apps"

  # What a target with no Visual C++ runtime does with an installer built the way the app builds one.
  # Every runner has that runtime, so this one has it taken away. Microsoft's redistributable is in
  # what this builds, and its license does not cover handing that on, so nothing here is uploaded.
  real-apps-runtime:
    name: Real apps, a PC with no runtime
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WAM_ELEVATED_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Has to be the version in rust-toolchain.toml, which is what cargo goes by.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install it from its publisher
        shell: pwsh
        run: .github/scripts/install-real-apps.ps1 -Output "${{ runner.temp }}\wam-runtime" -Only mosquitto

      - name: Build its installer with the runtime in it
        shell: pwsh
        env:
          WAM_REAL_APPS_RUNTIME: ${{ runner.temp }}\wam-runtime
        run: cargo test --locked -p winappmigrator-installer --test elevated_real_apps -- --nocapture --test-threads=1

      - name: Take the runtime away, install it, and ask it to serve
        shell: pwsh
        run: .github/scripts/check-runtime-arrives.ps1 -Folder "${{ runner.temp }}\wam-runtime"

  # Every other test of the screens draws them with no window. This opens the real programs on runners
  # that have no graphics card, and looks at what is on the screen. It clicks nothing.
  real-windows:
    name: Real windows on ${{ matrix.os }}
    needs: [windows-quality, move-build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WAM_ELEVATED_E2E: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]

    steps:
      - name: Checkout the scripts, and none of the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Take the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wam-app
          path: ${{ runner.temp }}\wam-app

      - name: Take an installer of the test app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wam-move-installers
          path: ${{ runner.temp }}\wam-move

      - name: Take what is planted
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wam-planted
          path: ${{ runner.temp }}\wam-planted

      - name: Open them, and look at what is on the screen
        shell: pwsh
        run: .github/scripts/check-real-windows.ps1 -App "${{ runner.temp }}\wam-app\winappmigrator.exe" -Installers "${{ runner.temp }}\wam-move" -Pictures "${{ runner.temp }}\wam-pictures" -Planted "${{ runner.temp }}\wam-planted"

      # Of the test app, and of the runner's own list of what it has installed.
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wam-pictures-${{ matrix.os }}
          path: ${{ runner.temp }}\wam-pictures
          retention-days: 1
          if-no-files-found: warn
