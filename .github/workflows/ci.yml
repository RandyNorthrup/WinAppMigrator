name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    name: Windows quality gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version comes from rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install security tools
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-audit,cargo-deny

      - name: Format check
        shell: pwsh
        run: cargo fmt --check

      - name: Typecheck
        shell: pwsh
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint
        shell: pwsh
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Not --all-targets: that runs the executables as test harnesses, and they demand
      # elevation. The end-to-end test does run the installer, and fails here rather
      # than skipping if it cannot.
      - name: Test
        shell: pwsh
        run: cargo test --locked --workspace --all-features

      - name: Security audit
        shell: pwsh
        run: cargo audit

      - name: Dependency policy
        shell: pwsh
        run: cargo deny check

      - name: Release build
        shell: pwsh
        run: cargo build --locked --workspace --release
