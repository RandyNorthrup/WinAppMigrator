# Configuration for `cargo about generate` — produces THIRD-PARTY-LICENSES.md,
# the attribution bundle for the open-source crates compiled into the shipped
# binaries. WinAppMigrator is MIT (see LICENSE).

# Only build for the platform we ship (Windows x64); this prunes deps that only
# exist for other targets (e.g. UEFI/Unix-only crates) from the attribution.
targets = ["x86_64-pc-windows-msvc"]

# What is not in the shipped binaries has no attribution to give: this project's
# own crates, which are not published, and what only tests and build scripts use.
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
workarounds = []

# Every license we are willing to redistribute under. None of them is copyleft. For
# dual/multi-licensed crates cargo-about elects the first of these it finds, so
# GPL/LGPL "OR" alternatives are never chosen. A crate under anything else fails
# the generation, and so fails a release.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
