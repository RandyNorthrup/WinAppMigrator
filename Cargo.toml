[workspace]
members = [
    "crates/winappmigrator-core",
    "crates/winappmigrator-cli",
    "crates/winappmigrator-gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "wgpu"] }
filetime = "0.2.29"
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.49", features = ["formatting"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
winreg = "0.56.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
winappmigrator-core = { version = "0.1.0", path = "crates/winappmigrator-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
