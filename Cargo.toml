[workspace]
members = [
    "crates/winappmigrator-core",
    "crates/winappmigrator-ui",
    "crates/winappmigrator-gui",
    "crates/winappmigrator-installer",
    "crates/winappmigrator-link",
    "crates/winappmigrator-client",
]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
authors = ["Randy Northrup"]
publish = false

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu_no_default_features"] }
crc32fast = "1.5.0"
filetime = "0.2.29"
# The same one `zip` uses, for compressing a file's parts on many threads.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
# How much room a drive has, which takes a Windows call this project cannot make itself.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
rfd = { version = "0.17.2", default-features = false }
roxmltree = "0.21.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.49", features = ["formatting"] }
tracing = "0.1.44"
ureq = { version = "2.12.1", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2.14"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
walkdir = "2.5.0"
winreg = "0.56.0"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }
winappmigrator-core = { version = "0.6.1", path = "crates/winappmigrator-core" }
winappmigrator-ui = { version = "0.6.1", path = "crates/winappmigrator-ui" }
winappmigrator-link = { version = "0.6.1", path = "crates/winappmigrator-link" }
winappmigrator-client = { version = "0.6.1", path = "crates/winappmigrator-client" }
embed-manifest = "1.5.1"
winresource = { version = "0.1.34", default-features = false }
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }
# Direct3D 12 only. Windows 10/11 come with it, including a software fallback on
# machines without a usable GPU, as CI's runners use, and leaving out Vulkan and OpenGL makes every
# installer smaller and means fewer DLLs are ever searched for.
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

# The core does heavy compute (SHA-256, zip, PE parsing, large directory walks).
# Build first-party code at opt-level 1 and dependencies at opt-level 2 in
# dev/test so discovery, packaging, and the end-to-end installer test run in
# seconds rather than minutes, while keeping debug info.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Lean, fast release binaries for the app and the installer it ships.
[profile.release]
lto = true
codegen-units = 1
strip = true
