[workspace]
members = [
    "crates/winappmigrator-core",
    "crates/winappmigrator-ui",
    "crates/winappmigrator-gui",
    "crates/winappmigrator-installer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "wgpu"] }
filetime = "0.2.29"
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
rfd = { version = "0.17.2", default-features = false }
roxmltree = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.49", features = ["formatting"] }
tracing = "0.1.44"
ureq = { version = "2.12.1", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2.14"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
winreg = "0.56.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
winappmigrator-core = { version = "0.1.0", path = "crates/winappmigrator-core" }
winappmigrator-ui = { version = "0.1.0", path = "crates/winappmigrator-ui" }
embed-manifest = "1.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

# The core does heavy compute (SHA-256, zip, PE parsing, large directory walks).
# Build first-party code at opt-level 1 and dependencies at opt-level 2 in
# dev/test so discovery, packaging, and the end-to-end installer test run in
# seconds rather than minutes, while keeping debug info.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Lean, fast release binaries for the app and the installer it ships.
[profile.release]
lto = true
codegen-units = 1
strip = true
